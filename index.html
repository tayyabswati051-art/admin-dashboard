<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ShopFlow — a responsive, frontend-only commerce admin dashboard portfolio project.">
  <title>ShopFlow — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="ShopFlow dashboard"><span class="brand-mark"><i class="bi bi-bag-check-fill"></i></span><span>shop<span class="brand-light">flow</span></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <a href="#dashboard" class="nav-link active" data-view="dashboard"><i class="bi bi-grid-1x2-fill"></i><span>Overview</span></a>
        <a href="#products" class="nav-link" data-view="products"><i class="bi bi-box-seam"></i><span>Products</span><span class="nav-count" id="productNavCount">8</span></a>
        <a href="#orders" class="nav-link" data-view="orders"><i class="bi bi-receipt"></i><span>Orders</span><span class="nav-count" id="orderNavCount">6</span></a>
        <a href="#customers" class="nav-link" data-view="customers"><i class="bi bi-people"></i><span>Customers</span></a>
        <a href="#analytics" class="nav-link" data-view="analytics"><i class="bi bi-bar-chart-line"></i><span>Analytics</span></a>
      </nav>
      <div class="workspace-label side-bottom-label">PREFERENCES</div>
      <nav class="side-nav">
        <a href="#settings" class="nav-link" data-view="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
        <a href="#help" class="nav-link" data-view="help"><i class="bi bi-life-preserver"></i><span>Help & support</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="upgrade-card"><div class="upgrade-icon"><i class="bi bi-stars"></i></div><strong>Level up your store</strong><p>Explore insights and grow your business.</p><button class="upgrade-btn" data-view="analytics">Explore insights <i class="bi bi-arrow-up-right"></i></button></div>
        <button class="user-mini" id="sidebarUser"><span class="avatar avatar-purple">TK</span><span class="user-mini-copy"><strong id="sidebarUserName">Tayyab Khan</strong><small>Store administrator</small></span><i class="bi bi-three-dots"></i></button>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuToggle" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
        <div class="breadcrumb"><span>Workspace</span><i class="bi bi-chevron-right"></i><strong id="breadcrumbCurrent">Overview</strong></div>
        <div class="topbar-actions">
          <label class="global-search"><i class="bi bi-search"></i><input id="globalSearch" type="search" placeholder="Search anything..." aria-label="Search dashboard"><kbd>⌘ K</kbd></label>
          <button class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifications"><i class="bi bi-bell"></i><span></span></button>
          <div class="topbar-divider"></div>
          <button class="profile-trigger" id="profileTrigger"><span class="avatar avatar-purple">TK</span><span class="profile-copy"><strong id="topUserName">Tayyab Khan</strong><small>Administrator</small></span><i class="bi bi-chevron-down"></i></button>
          <div class="profile-menu hidden" id="profileMenu"><button data-view="settings"><i class="bi bi-person"></i> Profile & settings</button><button id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Sign out</button></div>
        </div>
      </header>
      <section class="page-content" id="pageContent" aria-live="polite"></section>
      <footer class="footer"><span>© <span id="yearNow"></span> ShopFlow Admin</span><span>Crafted with care · Frontend demo</span></footer>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
</body>
</html>
